<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Tip Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="title">Welcome to the Tip Calculator</h1>
    
    <form onsubmit="event.preventDefault(); TipCalculator()">
         <label for="totalbill">Total Bill:</label> 
         <input type="number" id="totalbill" name="totalbill"> <br>
        <label for="tippercentage">Tip Percentage:</label>
        <input type="number" id="tippercentage" name="tippercentage" min="0" max="100"><br>
        <label for="numpeople">Number of People:</label>
        <input type="number" id="numpeople" name="numpeople" min="1">
        <br><br>
        <input type="submit" value="Calculate Tip">
    </form>
    <h1>Total Tip: $<span id="totaltip">0.00</span></h1>
    <h1>Tip per Person: $<span id="tipperperson">0.00</span></h1>

    <script src="./script.js"></script>
</body>

</html>
