<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A sleek, modern tip calculator to split bills and calculate tips instantly." />
  <title>TipSplit – Smart Tip Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background Orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="page-wrapper">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">💸</span>
        <span class="logo-text">TipSplit</span>
      </div>
      <p class="tagline">Calculate tips & split bills in seconds</p>
    </header>

    <main class="calculator-grid">

      <!-- INPUT PANEL -->
      <section class="card input-card" aria-label="Calculator Inputs">

        <!-- Bill Amount -->
        <div class="input-group">
          <label for="bill-amount" class="input-label">
            <span class="label-icon">🧾</span> Bill Amount
          </label>
          <div class="input-wrapper">
            <span class="input-prefix">$</span>
            <input
              type="number"
              id="bill-amount"
              class="input-field"
              placeholder="0.00"
              min="0"
              step="0.01"
              aria-label="Enter bill amount"
            />
          </div>
          <span class="input-error" id="bill-error" role="alert"></span>
        </div>

        <!-- Tip Percentage -->
        <div class="input-group">
          <label class="input-label">
            <span class="label-icon">✨</span> Select Tip %
          </label>
          <div class="tip-buttons" role="group" aria-label="Tip percentage options">
            <button class="tip-btn" data-tip="5" id="tip-5">5%</button>
            <button class="tip-btn" data-tip="10" id="tip-10">10%</button>
            <button class="tip-btn active" data-tip="15" id="tip-15">15%</button>
            <button class="tip-btn" data-tip="20" id="tip-20">20%</button>
            <button class="tip-btn" data-tip="25" id="tip-25">25%</button>
            <button class="tip-btn tip-btn--custom" data-tip="custom" id="tip-custom">Custom</button>
          </div>
          <div class="custom-tip-wrapper" id="custom-tip-wrapper" hidden>
            <div class="input-wrapper">
              <input
                type="number"
                id="custom-tip"
                class="input-field"
                placeholder="Enter %"
                min="0"
                max="100"
                aria-label="Enter custom tip percentage"
              />
              <span class="input-suffix">%</span>
            </div>
          </div>
        </div>

        <!-- Number of People -->
        <div class="input-group">
          <label for="num-people" class="input-label">
            <span class="label-icon">👥</span> Number of People
          </label>
          <div class="people-control">
            <button class="stepper-btn" id="decrease-people" aria-label="Decrease number of people">−</button>
            <input
              type="number"
              id="num-people"
              class="input-field people-field"
              value="1"
              min="1"
              max="99"
              aria-label="Number of people splitting the bill"
            />
            <button class="stepper-btn" id="increase-people" aria-label="Increase number of people">+</button>
          </div>
          <span class="input-error" id="people-error" role="alert"></span>
        </div>

        <!-- Reset Button -->
        <button class="reset-btn" id="reset-btn" aria-label="Reset all values">
          <span>↺</span> Reset
        </button>

      </section>

      <!-- RESULTS PANEL -->
      <section class="card results-card" aria-label="Calculation Results">

        <h2 class="results-heading">Your Summary</h2>

        <div class="result-item">
          <div class="result-info">
            <span class="result-label">Tip Amount</span>
            <span class="result-sub">per person</span>
          </div>
          <span class="result-value" id="tip-per-person">$0.00</span>
        </div>

        <div class="result-divider"></div>

        <div class="result-item">
          <div class="result-info">
            <span class="result-label">Total Amount</span>
            <span class="result-sub">per person</span>
          </div>
          <span class="result-value" id="total-per-person">$0.00</span>
        </div>

        <div class="result-divider"></div>

        <div class="result-item">
          <div class="result-info">
            <span class="result-label">Total Bill</span>
            <span class="result-sub">includes tip</span>
          </div>
          <span class="result-value result-value--secondary" id="total-bill">$0.00</span>
        </div>

        <div class="result-breakdown">
          <div class="breakdown-row">
            <span class="breakdown-label">Subtotal</span>
            <span class="breakdown-val" id="result-subtotal">$0.00</span>
          </div>
          <div class="breakdown-row">
            <span class="breakdown-label">Tip (<span id="result-tip-pct">15</span>%)</span>
            <span class="breakdown-val" id="result-tip-total">$0.00</span>
          </div>
          <div class="breakdown-row">
            <span class="breakdown-label">Split between</span>
            <span class="breakdown-val" id="result-people">1 person</span>
          </div>
        </div>

      </section>

    </main>

    <footer class="footer">
      <p>Built with ❤️ &mdash; TipSplit &copy; 2026</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
